<div class="pdi" data-pdi>
  <div class="pdi__zone" data-pdi-zone tabindex="0"
       aria-label="Paste with Control V or drop files here to inspect what the clipboard actually contains">
    <p class="pdi__cue">Paste or drop here</p>
    <p class="pdi__sub">Ctrl/Cmd+V, or drag a file or folder in</p>
  </div>

  <!-- Every flavour, with its byte size. A paste is not one thing: copying
       from a spreadsheet hands over HTML, plain text and often an image. -->
  <ul class="pdi__list" data-pdi-list aria-live="polite"></ul>
  <p class="pdi__note" data-pdi-note></p>
</div>
