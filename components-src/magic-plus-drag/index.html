<div class="mpd" data-mpd>
  <ol class="mpd__list" data-mpd-list>
    <li class="mpd__item">Pre-flight checks</li>
    <li class="mpd__item">Fuel load sign-off</li>
    <li class="mpd__item">Cabin secure</li>
    <li class="mpd__item">Pushback clearance</li>
  </ol>

  <!-- The plus is not a button that appends. It is torn off and dropped, so
       the drop position IS the insert position — no "added to the end, now
       drag it where you wanted it" second step. -->
  <button class="mpd__plus" type="button" data-mpd-plus
          aria-label="Drag to insert a step, or press Enter to choose a position with the arrow keys">+</button>

  <p class="mpd__read" data-mpd-read aria-live="polite">Drag the plus between two steps.</p>
</div>
