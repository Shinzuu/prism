<div class="sl" data-sl>
  <div class="sl__rail" data-sl-rail>
    <span class="sl__fill" data-sl-fill></span>
    <span class="sl__label" data-sl-label>Slide to delete this airframe</span>
    <button class="sl__grip" type="button" data-sl-grip role="slider"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
      aria-label="Slide right to confirm deletion. Or hold the right arrow key.">
      <span aria-hidden="true">›</span>
    </button>
  </div>
  <p class="sl__out" role="status" aria-live="polite" data-sl-out></p>
</div>
