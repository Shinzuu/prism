<div class="psp" data-psp>
  <div class="psp__head">
    <p class="psp__t">Sign here</p>
    <p class="psp__meta" data-psp-meta>draw to measure sampling</p>
  </div>
  <canvas class="psp__pad" data-psp-pad width="1040" height="300"
          role="img" aria-label="Signature area. Draw with a mouse, finger or stylus."></canvas>
  <div class="psp__bar">
    <button class="psp__btn psp__btn--ghost" type="button" data-psp-clear>Clear</button>
    <span class="psp__hint" data-psp-hint></span>
  </div>
</div>
