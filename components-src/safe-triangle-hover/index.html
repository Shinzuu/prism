<div class="sth" data-sth>
  <div class="sth__row">
    <ul class="sth__menu" data-sth-menu>
      <li><button class="sth__item" type="button" data-sth-item="Runtime" aria-haspopup="true" aria-expanded="false">Runtime</button></li>
      <li><button class="sth__item" type="button" data-sth-item="Storage" aria-haspopup="true" aria-expanded="false">Storage</button></li>
      <li><button class="sth__item" type="button" data-sth-item="Network" aria-haspopup="true" aria-expanded="false">Network</button></li>
      <li><button class="sth__item" type="button" data-sth-item="Billing" aria-haspopup="true" aria-expanded="false">Billing</button></li>
    </ul>
    <div class="sth__panel" data-sth-panel hidden></div>
    <!-- The wedge your pointer is allowed to cross. Without it, moving
         diagonally toward the panel passes over the next item and closes it. -->
    <svg class="sth__tri" data-sth-tri aria-hidden="true"><polygon data-sth-poly /></svg>
  </div>
  <label class="sth__tog"><input type="checkbox" data-sth-show checked> <span>Show the safe triangle</span></label>
  <label class="sth__tog"><input type="checkbox" data-sth-off> <span>Disable it — try reaching the panel diagonally</span></label>
</div>
