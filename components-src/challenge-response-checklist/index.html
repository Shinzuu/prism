<div class="crc" data-crc>
  <div class="crc__head">
    <p class="crc__t">Before pushback</p>
    <p class="crc__meta" data-crc-meta aria-live="polite"></p>
  </div>

  <ol class="crc__list" data-crc-list></ol>

  <div class="crc__foot">
    <button class="crc__btn" type="button" data-crc-commit disabled>Commit</button>
    <button class="crc__btn crc__btn--ghost" type="button" data-crc-reset>Reset</button>
  </div>
  <p class="crc__note">Each line states a condition and is confirmed on its own. One item deliberately holds — it cannot be confirmed until its precondition is true, and no amount of clicking will skip it.</p>
</div>
