<div class="hs" data-hs>
  <div class="hs__stage"><p class="hs__text" data-hs-text></p></div>
  <div class="hs__controls">
    <input class="hs__range" type="range" data-hs-range min="0" max="0" value="0"
      aria-label="History position" />
    <div class="hs__meta">
      <span data-hs-when></span>
      <span data-hs-what></span>
      <button type="button" data-hs-restore hidden>Restore this version</button>
    </div>
  </div>
  <div class="hs__edit">
    <input data-hs-input placeholder="Type a change and press Enter" aria-label="Make a change" autocomplete="off" />
  </div>
  <p class="hs__sr" role="status" aria-live="polite" data-hs-sr></p>
</div>
