<figure class="qd" data-qd>
  <figcaption class="qd__cap">When will the part arrive?</figcaption>

  <div class="qd__plot" data-qd-plot role="img" data-qd-label></div>

  <div class="qd__axis" data-qd-axis aria-hidden="true"></div>

  <p class="qd__read" data-qd-read></p>

  <label class="qd__ctl">
    Deadline
    <input type="range" data-qd-cut min="2" max="14" step="0.5" value="9" />
    <output data-qd-out></output>
  </label>

  <table class="qd__data" data-qd-table>
    <caption>Predicted arrival, by quantile</caption>
    <thead><tr><th scope="col">Quantile</th><th scope="col">Day</th></tr></thead>
    <tbody></tbody>
  </table>
</figure>
