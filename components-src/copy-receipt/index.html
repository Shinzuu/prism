<div class="cr" data-cr>
  <pre class="cr__source" data-cr-source>npm install --save-exact prism-ui@1.4.2</pre>
  <button class="cr__btn" type="button" data-cr-btn>Copy command</button>
  <div class="cr__receipt" data-cr-receipt hidden>
    <p class="cr__head">Copied to clipboard</p>
    <pre class="cr__what" data-cr-what></pre>
    <p class="cr__meta"><span data-cr-count></span> · from <span data-cr-from></span></p>
    <button class="cr__undo" type="button" data-cr-undo>Put back what was there</button>
  </div>
  <p class="cr__sr" role="status" aria-live="polite" data-cr-sr></p>
</div>
