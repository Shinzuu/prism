<form class="caf" data-caf novalidate>
  <div class="caf__row">
    <label class="caf__lab" for="caf-country">Country</label>
    <select class="caf__sel" id="caf-country" data-caf-country>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="JP">Japan</option>
      <option value="DE">Germany</option>
      <option value="IE">Ireland</option>
    </select>
  </div>

  <!-- Rebuilt per country. The order, the labels and which fields exist at all
       are properties of the country, not decoration on a fixed form. -->
  <div class="caf__fields" data-caf-fields></div>

  <output class="caf__out" data-caf-out aria-live="polite"></output>
</form>
