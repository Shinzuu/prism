<div class="fc" data-fc>
  <div class="fc__head">
    <p class="fc__title">Error rate by region</p>
    <button class="fc__sim" data-fc-sim aria-pressed="false">Simulate forced colors</button>
  </div>

  <svg class="fc__svg" viewBox="0 0 320 120" role="img"
       aria-label="Error rate over twelve weeks for four regions. Values are also listed in the table below.">
    <defs>
      <!-- Redundant encoding: every series carries a dash pattern and a marker
           shape as well as a colour, so it survives colour being confiscated. -->
      <g id="fc-m0"><circle r="3"/></g>
      <g id="fc-m1"><rect x="-2.6" y="-2.6" width="5.2" height="5.2"/></g>
      <g id="fc-m2"><polygon points="0,-3.2 3.2,2.4 -3.2,2.4"/></g>
      <g id="fc-m3"><polygon points="0,-3.4 3.4,0 0,3.4 -3.4,0"/></g>
    </defs>
    <g class="fc__series" data-fc-series></g>
  </svg>

  <ul class="fc__legend" data-fc-legend></ul>

  <!-- The chart is a picture; this is the data. It is not a fallback, it is -->
  <!-- the part that works in a screen reader, in print and in high contrast. -->
  <details class="fc__data">
    <summary>Values</summary>
    <table class="fc__table" data-fc-table></table>
  </details>
</div>
