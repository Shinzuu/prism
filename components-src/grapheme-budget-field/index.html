<div class="gbf" data-gbf>
  <label class="gbf__lab" for="gbf-in">Status message</label>
  <textarea class="gbf__in" id="gbf-in" rows="3" data-gbf-in
    aria-describedby="gbf-count">Shipping 🇯🇵 today 👨‍👩‍👧‍👦 — café</textarea>

  <div class="gbf__bar">
    <p class="gbf__count" id="gbf-count" data-gbf-count aria-live="polite"></p>
    <button class="gbf__btn" type="button" data-gbf-trunc>Truncate to limit</button>
  </div>

  <!-- The three counts a developer might use, side by side, because they
       disagree and only one of them matches what a person sees. -->
  <table class="gbf__cmp">
    <tr><th scope="row">.length (UTF-16 units)</th><td data-gbf-units></td><td class="gbf__note">what most code counts</td></tr>
    <tr><th scope="row">[...string] (code points)</th><td data-gbf-points></td><td class="gbf__note">better, still wrong</td></tr>
    <tr><th scope="row">Intl.Segmenter (graphemes)</th><td data-gbf-graph></td><td class="gbf__note">what a person counts</td></tr>
  </table>
</div>
