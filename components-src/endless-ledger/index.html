<div class="el" data-el>
  <div class="el__head">
    <p class="el__title">Trade ledger</p>
    <p class="el__meta"><span data-el-count></span> · <span data-el-paint></span></p>
  </div>
  <!-- ARIA grid roles, not a <table>. A table box builds its own row grid by
       walking every row, so per-row containment cannot save it. Div rows keep
       the semantics for assistive tech and let the browser skip the rest. -->
  <div class="el__grid" role="table" aria-rowcount="50000" aria-label="Trade ledger">
    <!-- The header lives inside the scroller and sticks. Outside it, the
         scrollbar narrows the rows but not the header and the columns drift. -->
    <div class="el__scroll" data-el-scroll tabindex="0" aria-label="Ledger rows">
      <div class="el__row el__row--head" role="row">
        <span role="columnheader">#</span>
        <span role="columnheader">Instrument</span>
        <span role="columnheader">Side</span>
        <span role="columnheader">Qty</span>
        <span role="columnheader">Price</span>
      </div>
      <div data-el-body role="rowgroup"></div>
    </div>
  </div>
  <p class="el__note">Fifty thousand real rows. No virtualization library, no windowing, no scroll listener.</p>
</div>
