<div class="pz" data-pz tabindex="0" role="application" aria-label="Pannable, zoomable canvas. Arrow keys pan, plus and minus zoom, zero resets.">
  <div class="pz__viewport" data-pz-viewport>
    <div class="pz__world" data-pz-world>
      <div class="pz__node" style="--x:40px;  --y:40px">Intake</div>
      <div class="pz__node" style="--x:260px; --y:120px">Compressor</div>
      <div class="pz__node" style="--x:480px; --y:60px">Combustor</div>
      <div class="pz__node" style="--x:700px; --y:170px">Turbine</div>
      <div class="pz__node" style="--x:300px; --y:320px">Afterburner</div>
      <div class="pz__node" style="--x:600px; --y:400px">Nozzle</div>
      <svg class="pz__links" viewBox="0 0 900 500" aria-hidden="true">
        <path d="M110 60 L300 140 M360 140 L520 80 M580 80 L740 190 M360 150 L340 330 M400 340 L640 415" />
      </svg>
    </div>
  </div>
  <div class="pz__hud">
    <span data-pz-zoom></span>
    <button type="button" data-pz-fit>fit</button>
  </div>
  <div class="pz__mini" data-pz-mini aria-hidden="true"><span data-pz-eye></span></div>
</div>
