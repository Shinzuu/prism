<div class="smt" data-smt>
  <div class="smt__head">
    <p class="smt__title">Deploys</p>
    <p class="smt__meta" data-smt-meta aria-live="polite">Sorted by time</p>
  </div>
  <table class="smt__table">
    <thead>
      <tr>
        <th scope="col"><button class="smt__sort" data-smt-key="service" type="button">Service</button></th>
        <th scope="col"><button class="smt__sort" data-smt-key="dur" type="button">Duration</button></th>
        <th scope="col"><button class="smt__sort" data-smt-key="fails" type="button">Failures</button></th>
        <th scope="col"><button class="smt__sort" data-smt-key="when" type="button" aria-sort="ascending">Time</button></th>
      </tr>
    </thead>
    <tbody data-smt-body></tbody>
  </table>
  <p class="smt__note">Rows travel to their new places, so you can follow the one you were reading instead of hunting for it again.</p>
</div>
