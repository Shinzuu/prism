<div class="df" data-df>
  <label class="df__label" for="df-in">Timeout</label>
  <input class="df__input" id="df-in" type="text" value="2h 30m" autocomplete="off"
    spellcheck="false" inputmode="text" aria-describedby="df-help" />
  <p class="df__help" id="df-help">Try <code>90m</code>, <code>1:30</code>, <code>2h30</code>, <code>1d 4h</code> or <code>45s</code>.</p>
  <p class="df__norm" data-df-norm role="status" aria-live="polite"></p>
</div>
