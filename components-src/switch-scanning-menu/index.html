<div class="ssm" data-ssm>
  <div class="ssm__head">
    <p class="ssm__t">Switch scanning</p>
    <p class="ssm__meta" data-ssm-meta aria-live="polite"></p>
  </div>

  <!-- One key operates everything. The scan walks groups; pressing the key
       drops into a group and walks its items; pressing again selects. -->
  <div class="ssm__stage" data-ssm-stage tabindex="0" role="application"
       aria-label="Switch scanning menu. Press Space to select, Escape to leave a group.">
    <div class="ssm__group" data-ssm-group="File">
      <p class="ssm__gl">File</p>
      <ul class="ssm__items"><li>New</li><li>Open</li><li>Save</li></ul>
    </div>
    <div class="ssm__group" data-ssm-group="Edit">
      <p class="ssm__gl">Edit</p>
      <ul class="ssm__items"><li>Undo</li><li>Cut</li><li>Paste</li></ul>
    </div>
    <div class="ssm__group" data-ssm-group="View">
      <p class="ssm__gl">View</p>
      <ul class="ssm__items"><li>Zoom in</li><li>Full screen</li></ul>
    </div>
    <svg class="ssm__ring" data-ssm-ring viewBox="0 0 36 36" aria-hidden="true">
      <circle class="ssm__ring-bg" cx="18" cy="18" r="15" />
      <circle class="ssm__ring-fg" data-ssm-arc cx="18" cy="18" r="15" />
    </svg>
  </div>

  <div class="ssm__bar">
    <button class="ssm__key" type="button" data-ssm-key>Switch (or press Space)</button>
    <label class="ssm__sp">Dwell
      <input type="range" min="700" max="2600" step="100" value="1400" data-ssm-dwell>
      <output data-ssm-dwellv></output>
    </label>
  </div>
  <p class="ssm__note">One input, the whole menu. The ring is the time remaining before the scan moves on — without it the user is guessing how long they have.</p>
</div>
