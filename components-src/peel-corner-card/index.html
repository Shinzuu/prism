<div class="pc" data-pc>
  <article class="pc__card" data-pc-card style="--pc-peel: 0;">
    <div class="pc__face">
      <p class="pc__kicker">Boarding pass</p>
      <p class="pc__t">SEA → NRT</p>
      <p class="pc__d">Seat 14A · Gate N7 · Boards 09:40</p>
    </div>
    <!-- The reverse is a real layer underneath, revealed by the same clip the
         curl exposes, so what the peel uncovers is content and not a colour. -->
    <div class="pc__back" aria-hidden="true">
      <p class="pc__back-t">Fare rules</p>
      <p class="pc__back-d">24h changes<br>no refund</p>
    </div>
    <!-- The flap: the cut triangle mirrored across the fold, so it lies on the
         face and leaves the cut open. Clip it to the cut itself and it covers
         exactly the hole it is meant to reveal. -->
    <div class="pc__curl" data-pc-curl aria-hidden="true"></div>
    <button class="pc__grab" data-pc-grab aria-expanded="false" aria-controls="pc-back">
      <span class="pc__sr">Peel the corner to read the fare rules</span>
    </button>
  </article>
  <p class="pc__hint">Drag the corner, or press the corner button and use the arrow keys.</p>
</div>
