<div class="op" data-op>
  <div class="op__swatch" data-op-swatch></div>
  <div class="op__fields">
    <label>Lightness <input type="range" data-op="l" min="0" max="100" step="0.5" value="62"><output data-op-out="l"></output></label>
    <label>Chroma <input type="range" data-op="c" min="0" max="0.37" step="0.005" value="0.18"><output data-op-out="c"></output></label>
    <label>Hue <input type="range" data-op="h" min="0" max="360" step="1" value="28"><output data-op-out="h"></output></label>
  </div>
  <p class="op__gamut" data-op-gamut hidden>Outside the sRGB gamut — this is the nearest displayable colour.</p>
  <p class="op__code"><code data-op-code></code> <button type="button" data-op-copy>copy</button></p>
</div>
