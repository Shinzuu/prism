<div class="rm" data-rm>
  <button class="rm__anchor" type="button" data-rm-anchor aria-haspopup="menu" aria-expanded="false">
    Press and hold
  </button>
  <div class="rm__wheel" data-rm-wheel role="menu" aria-label="Actions" hidden>
    <button class="rm__item" role="menuitem" type="button" data-act="Duplicate">Duplicate</button>
    <button class="rm__item" role="menuitem" type="button" data-act="Move">Move</button>
    <button class="rm__item" role="menuitem" type="button" data-act="Export">Export</button>
    <button class="rm__item" role="menuitem" type="button" data-act="Rename">Rename</button>
    <button class="rm__item" role="menuitem" type="button" data-act="Archive">Archive</button>
    <button class="rm__item" role="menuitem" type="button" data-act="Delete">Delete</button>
    <span class="rm__hub" aria-hidden="true"></span>
  </div>
  <p class="rm__out" data-rm-out role="status" aria-live="polite"></p>
</div>
