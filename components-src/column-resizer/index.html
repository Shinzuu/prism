<div class="cz" data-cz>
  <table class="cz__table" data-cz-table>
    <caption class="cz__cap">Drag a divider, or focus one and use arrow keys. Widths persist.</caption>
    <thead><tr>
      <th scope="col" style="--w:200px">Designation<span class="cz__grip" data-cz-grip tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize Designation column" aria-valuenow="200"></span></th>
      <th scope="col" style="--w:120px">Role<span class="cz__grip" data-cz-grip tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize Role column" aria-valuenow="120"></span></th>
      <th scope="col" style="--w:110px">Sweep<span class="cz__grip" data-cz-grip tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize Sweep column" aria-valuenow="110"></span></th>
      <th scope="col" style="--w:120px">First flight</th>
    </tr></thead>
    <tbody>
      <tr><th scope="row">F-14D Super Tomcat</th><td>Interceptor</td><td>20–68°</td><td>1970</td></tr>
      <tr><th scope="row">Panavia Tornado GR4</th><td>Strike</td><td>25–67°</td><td>1974</td></tr>
      <tr><th scope="row">Sukhoi Su-24M</th><td>Strike</td><td>16–69°</td><td>1967</td></tr>
      <tr><th scope="row">Rockwell B-1B Lancer</th><td>Bomber</td><td>15–67°</td><td>1974</td></tr>
    </tbody>
  </table>
  <button class="cz__reset" type="button" data-cz-reset>Reset widths</button>
</div>
