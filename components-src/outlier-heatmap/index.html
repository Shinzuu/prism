<div class="oh" data-oh>
  <div class="oh__head">
    <p class="oh__title">Request latency <span class="oh__dim">— 1,400 requests</span></p>
    <p class="oh__read" data-oh-read>Drag a box around the slow cluster</p>
  </div>

  <div class="oh__plot" data-oh-plot>
    <canvas class="oh__canvas" data-oh-canvas width="600" height="260"
            role="img" aria-label="Scatter of request latency against payload size"></canvas>
    <div class="oh__sel" data-oh-sel hidden></div>
  </div>

  <!-- The answer, not the picture. Each dimension is ranked by how much more
       often its value appears inside the selection than outside it. -->
  <ol class="oh__ranks" data-oh-ranks aria-live="polite"></ol>
  <p class="oh__note">Lift is the rate inside the box divided by the rate outside. A tall bar means that value is over-represented among the slow requests.</p>
</div>
