<div class="cb" data-cb>
  <div class="cb__fields">
    <label>Minute <input data-cb-f="min" value="*/15" autocomplete="off" spellcheck="false"></label>
    <label>Hour <input data-cb-f="hour" value="9-17" autocomplete="off" spellcheck="false"></label>
    <label>Day <input data-cb-f="dom" value="*" autocomplete="off" spellcheck="false"></label>
    <label>Month <input data-cb-f="mon" value="*" autocomplete="off" spellcheck="false"></label>
    <label>Weekday <input data-cb-f="dow" value="1-5" autocomplete="off" spellcheck="false"></label>
  </div>
  <p class="cb__expr"><code data-cb-expr></code></p>
  <p class="cb__says" data-cb-says role="status" aria-live="polite"></p>
  <div class="cb__next">
    <p class="cb__nexth">Next five runs <span data-cb-tz></span></p>
    <ol data-cb-list></ol>
  </div>
</div>
