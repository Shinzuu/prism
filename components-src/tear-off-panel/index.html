<div class="top" data-top>
  <div class="top__dock" data-top-dock>
    <div class="top__head">
      <p class="top__t">Live readout</p>
      <button class="top__tear" type="button" data-top-tear>Tear off ↗</button>
    </div>
    <div class="top__body" data-top-body>
      <p class="top__big" data-top-val>—</p>
      <p class="top__sub">packets/s · shared state, not a copy</p>
      <label class="top__f">Rate
        <input type="range" min="1" max="60" value="24" data-top-rate>
      </label>
    </div>
  </div>
  <p class="top__note" data-top-note></p>
</div>
