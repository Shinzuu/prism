<div class="cb">
  <div class="cb__row">
    <!-- No onclick, no addEventListener. The button names its target and the
         action; the browser wires the rest, including focus return and Esc. -->
    <button class="cb__btn" commandfor="cb-sheet" command="show-modal">Review changes</button>
    <button class="cb__btn cb__btn--ghost" commandfor="cb-tip" command="toggle-popover">Shortcuts</button>
    <button class="cb__btn cb__btn--ghost" commandfor="cb-log" command="--clear">Clear log</button>
  </div>

  <div class="cb__tip" id="cb-tip" popover>
    <p class="cb__tip-t">Every button here is declarative</p>
    <p class="cb__tip-d">The dialog and this popover open with no script attached to them at all.</p>
  </div>

  <dialog class="cb__sheet" id="cb-sheet">
    <p class="cb__sheet-t">Review changes</p>
    <p class="cb__sheet-d">Esc closes this, focus returns to the button that opened it, and the page behind is inert — none of which is wired up by hand.</p>
    <button class="cb__btn" commandfor="cb-sheet" command="close">Close</button>
  </dialog>

  <output class="cb__log" id="cb-log" data-cb-log aria-live="polite"></output>
</div>
