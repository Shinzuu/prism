<div class="uf" data-uf>
  <label class="uf__label" for="uf-in">Inline size</label>
  <div class="uf__wrap">
    <input class="uf__input" id="uf-in" type="text" inputmode="decimal" value="1.5rem"
      autocomplete="off" spellcheck="false" aria-describedby="uf-help" />
    <span class="uf__unit" data-uf-unit>rem</span>
  </div>
  <p class="uf__help" id="uf-help">Arrow keys step the number and keep the unit. Shift for ten, Alt for a tenth.</p>
  <dl class="uf__conv" data-uf-conv></dl>
</div>
